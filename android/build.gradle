group 'com.printer.flutterandroidprinter'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.10'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        flatDir {
            dirs project(':flutterandroidprinter').file('libs')
        }
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.printer.flutterandroidprinter'
    compileSdkVersion 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdkVersion 16
    }
    lintOptions {
        disable 'InvalidPackage'
    }
}

dependencies{
    implementation(name: 'payLib', ext: 'aar')
    // https://mvnrepository.com/artifact/com.google.zxing/core
    compileOnly(name: 'core-3.4.0', ext: 'jar')
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.sunmi:printerx:1.0.13'
}
